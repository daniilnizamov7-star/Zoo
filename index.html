<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Челябинский зоопарк — карта</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a2e1a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    padding: 14px 20px;
    background: #142014;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 2px solid #2d5a2d;
  }
  header .logo { font-size: 22px; }
  header h1 { font-size: 16px; font-weight: 700; color: #e8f5e8; letter-spacing: 0.3px; }
  header p { font-size: 12px; color: #7aab7a; margin-top: 1px; }

  .map-wrapper {
    position: relative;
    display: inline-block;
    margin: 20px auto;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    width: 95%;
    max-width: 900px;
  }

  .map-wrapper img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* В режиме редактора — пины не мешают */
  .map-wrapper.editor-active {
    cursor: crosshair;
  }
  .map-wrapper.editor-active .animal-pin {
    pointer-events: none;
    opacity: 0.35;
  }

  .animal-pin {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.15s ease;
  }
  .animal-pin:hover { transform: translate(-50%, -50%) scale(1.25); }

  .pin-emoji {
    font-size: 30px;
    line-height: 1;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.6));
  }

  @media (max-width: 600px) {
    .pin-emoji { font-size: 18px; }
    .pin-label { font-size: 9px; padding: 1px 4px; }
  }

  .pin-label {
    background: rgba(10,20,10,0.82);
    color: #e8f5e8;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    margin-top: 3px;
    white-space: nowrap;
    backdrop-filter: blur(3px);
  }

  /* Модалка */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(6px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #1e3a1e;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 820px;
    max-height: 88vh;
    display: flex;
    flex-direction: row;
    overflow: hidden;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.7);
    border: 1px solid #2d5a2d;
    border-bottom: none;
    animation: modal-in 0.3s ease;
  }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Видео — левая половина */
  .modal-media {
    width: 45%;
    flex-shrink: 0;
    background: #0d1f0d;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .modal-media video, .modal-media img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .modal-media .media-placeholder { font-size: 72px; opacity: 0.6; }

  /* Правая часть — скроллится если контент длинный */
  .modal-body {
    flex: 1;
    padding: 24px 22px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  /* Мобильный — видео сверху, текст снизу */
  @media (max-width: 600px) {
    .modal-overlay { align-items: flex-end; }
    .modal {
      flex-direction: column;
      max-height: 88vh;
      border-radius: 16px 16px 0 0;
    }
    .modal-media {
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      flex-shrink: 0;
    }
    .modal-body {
      padding: 14px 16px 20px;
      overflow-y: auto;
    }
  }

  .modal-tag {
    display: inline-block;
    background: #2d5a2d; color: #7adb7a;
    font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
    padding: 3px 10px; border-radius: 20px; margin-bottom: 8px;
  }
  .modal-name { font-size: 26px; font-weight: 800; color: #e8f5e8; line-height: 1.1; margin-bottom: 6px; }
  .modal-latin { font-size: 13px; color: #5a8a5a; font-style: italic; margin-bottom: 14px; }
  .modal-desc { font-size: 14px; color: #a8c8a8; line-height: 1.6; margin-bottom: 16px; }

  .modal-facts { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .fact-chip {
    background: #142014; border: 1px solid #2d4a2d; border-radius: 10px;
    padding: 8px 12px; display: flex; flex-direction: column; align-items: center;
    gap: 2px; flex: 1; min-width: 80px;
  }
  .fact-chip .fact-icon { font-size: 18px; }
  .fact-chip .fact-val  { font-size: 14px; font-weight: 700; color: #e8f5e8; }
  .fact-chip .fact-lbl  { font-size: 10px; color: #5a8a5a; text-align: center; }

  .modal-close {
    width: 100%; padding: 13px;
    background: #2d8c2d; color: #fff;
    border: none; border-radius: 12px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .modal-close:hover { background: #3da83d; }

  /* Редактор */
  .editor-bar {
    text-align: center;
    padding: 10px 16px 20px;
  }
  #editorBtn {
    background: #2d5a2d; color: #e8f5e8;
    border: 1px solid #3d7a3d;
    padding: 9px 20px; border-radius: 8px;
    cursor: pointer; font-size: 13px; font-weight: 600;
    display: none;
  }
  #editorHint { display:none; margin-top:8px; color:#7aab7a; font-size:12px; }
  #coordOutput {
    display: none;
    margin-top: 10px;
    background: #142014; border: 1px solid #2d5a2d; border-radius: 8px;
    padding: 12px 16px;
    color: #7adb7a; font-family: monospace; font-size: 14px;
    cursor: pointer;
    user-select: all;
  }
  #coordOutput:hover { border-color: #4caf50; }
</style>
</head>
<body>

<header>
  <div class="logo">🦁</div>
  <div>
    <h1>Челябинский зоопарк</h1>
    <p>Нажмите на животное чтобы узнать о нём</p>
  </div>
</header>

<div class="map-wrapper" id="mapWrapper">
  <img src="1782328456389_image.png" alt="Карта зоопарка" id="mapImg" onload="renderPins()">
</div>

<div class="editor-bar">
  <button id="editorBtn" onclick="toggleEditor()">🛠 Режим расстановки точек</button>
  <div id="editorHint">Кликни по карте — координаты появятся ниже. Нажми на них чтобы скопировать.</div>
  <div id="coordOutput" onclick="copyCoords()" title="Нажми чтобы скопировать"></div>
</div>

<!-- Модалка -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-media" id="modalMedia"></div>
    <div class="modal-body">
      <span class="modal-tag" id="modalTag"></span>
      <div class="modal-name" id="modalName"></div>
      <div class="modal-latin" id="modalLatin"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-facts" id="modalFacts"></div>
      <button class="modal-close" onclick="closeModal()">Закрыть</button>
    </div>
  </div>
</div>

<script>
// ─── ДАННЫЕ ЖИВОТНЫХ ───────────────────────────────────────────
const animals = [
  {
    id: 'amur-tiger',
    emoji: '🐯',
    name: 'Амурский тигр',
    latin: 'Panthera tigris altaica',
    tag: 'Хищники',
    desc: 'Амурский тигр — самый крупный из всех тигров и единственный, кто приспособлен к жизни в снегу. Его шуба толще, чем у других подвидов, а лапы шире — как снегоступы. Занесён в Красную книгу России.',
    facts: [
      { icon: '⚖️', val: '300 кг', lbl: 'Вес самца' },
      { icon: '📏', val: '3.5 м', lbl: 'Длина тела' },
      { icon: '🏃', val: '80 км/ч', lbl: 'Скорость' },
      { icon: '🌍', val: '~600', lbl: 'Осталось в мире' },
    ],
    video: 'tiger.mp4',
    poster: 'tiger-poster.jpeg',
    pos: { left: 40.9, top: 31.3 },
  },
  {
    id: 'lion',
    emoji: '🦁',
    name: 'Лев',
    latin: 'Panthera leo',
    tag: 'Хищники',
    desc: 'Лев — единственная кошка, живущая группами (прайдами). Рёв льва слышен на расстоянии до 8 км и служит для обозначения территории. Самцы узнаваемы по пышной гриве, которая темнеет с возрастом.',
    facts: [
      { icon: '⚖️', val: '250 кг', lbl: 'Вес самца' },
      { icon: '😴', val: '20 ч', lbl: 'Сон в сутки' },
      { icon: '🔊', val: '8 км', lbl: 'Слышен рёв' },
      { icon: '👥', val: '30', lbl: 'Особей в прайде' },
    ],
    video: 'lion.mp4',
    poster: 'lion-poster.jpeg',
    pos: { left: 49.1, top: 34 },
  },
  {
    id: 'polar-bear',
    emoji: '🐻‍❄️',
    name: 'Белый медведь',
    latin: 'Ursus maritimus',
    tag: 'Хищники',
    desc: 'Белый медведь — крупнейший наземный хищник планеты. Его шерсть не белая, а прозрачная — каждый волос полый и пропускает свет. Прекрасно плавает, преодолевая сотни километров в открытом море.',
    facts: [
      { icon: '⚖️', val: '700 кг', lbl: 'Вес самца' },
      { icon: '🏊', val: '100 км', lbl: 'Заплыв за раз' },
      { icon: '👃', val: '32 км', lbl: 'Чует добычу' },
      { icon: '🌡️', val: '-50°C', lbl: 'Выдерживает' },
    ],
    video: 'polar-bear.mp4',
    poster: 'polar-bear-poster.jpeg',
    pos: { left: 71.2, top: 32.8 },
  },
  {
    id: 'bison',
    emoji: '🦬',
    name: 'Бизон',
    latin: 'Bison bison',
    tag: 'Травоядные',
    desc: 'Бизон — самое тяжёлое наземное животное Северной Америки. Несмотря на массивность, развивает скорость до 60 км/ч. В XIX веке был почти истреблён, но благодаря охране популяция восстановлена.',
    facts: [
      { icon: '⚖️', val: '1000 кг', lbl: 'Вес самца' },
      { icon: '🏃', val: '60 км/ч', lbl: 'Скорость' },
      { icon: '📅', val: '25 лет', lbl: 'Продолж. жизни' },
      { icon: '🌍', val: '~31 000', lbl: 'Осталось в мире' },
    ],
    video: 'bison.mp4',
    poster: 'bison-poster.jpeg',
    pos: { left: 68.1, top: 22.3 },
  }
];

// ─── РЕНДЕР ПИНОВ ──────────────────────────────────────────────
function renderPins() {
  const wrapper = document.getElementById('mapWrapper');
  animals.forEach(animal => {
    const pin = document.createElement('div');
    pin.className = 'animal-pin';
    pin.style.left = animal.pos.left + '%';
    pin.style.top  = animal.pos.top  + '%';
    pin.innerHTML = `
      <div class="pin-emoji">${animal.emoji}</div>
      <div class="pin-label">${animal.name}</div>
    `;
    pin.onclick = () => { if (!editorMode) openModal(animal); };
    wrapper.appendChild(pin);
  });
}

// ─── МОДАЛКА ───────────────────────────────────────────────────
function openModal(animal) {
  if (!animal.desc) return;
  document.getElementById('modalName').textContent  = animal.name;
  document.getElementById('modalLatin').textContent = animal.latin || '';
  document.getElementById('modalTag').textContent   = animal.tag  || '';
  document.getElementById('modalDesc').textContent  = animal.desc || '';
  document.getElementById('modalFacts').innerHTML   = (animal.facts || []).map(f => `
    <div class="fact-chip">
      <span class="fact-icon">${f.icon}</span>
      <span class="fact-val">${f.val}</span>
      <span class="fact-lbl">${f.lbl}</span>
    </div>
  `).join('');

  const mediaEl = document.getElementById('modalMedia');
  if (animal.video) {
    mediaEl.innerHTML = `<video src="${animal.video}" poster="${animal.poster || ''}" autoplay loop muted playsinline style="width:100%;height:100%;object-fit:cover;"></video>`;
  } else if (animal.poster) {
    mediaEl.innerHTML = `<img src="${animal.poster}" style="width:100%;height:100%;object-fit:cover;">`;
  } else {
    mediaEl.innerHTML = `<div class="media-placeholder">${animal.emoji}</div>`;
  }

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  // Останавливаем видео
  const v = document.querySelector('#modalMedia video');
  if (v) { v.pause(); v.src = ''; }
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ─── РЕДАКТОР ТОЧЕК ────────────────────────────────────────────
let editorMode = false;
let tempPin = null;
let lastCoords = null;

function toggleEditor() {
  editorMode = !editorMode;
  const btn     = document.getElementById('editorBtn');
  const hint    = document.getElementById('editorHint');
  const out     = document.getElementById('coordOutput');
  const wrapper = document.getElementById('mapWrapper');

  if (editorMode) {
    btn.textContent = '✅ Выйти из режима расстановки';
    btn.style.background  = '#5a2020';
    btn.style.borderColor = '#8a3030';
    hint.style.display = 'block';
    wrapper.classList.add('editor-active');
    wrapper.addEventListener('click', onMapClick);
  } else {
    btn.textContent = '🛠 Режим расстановки точек';
    btn.style.background  = '#2d5a2d';
    btn.style.borderColor = '#3d7a3d';
    hint.style.display = 'none';
    out.style.display  = 'none';
    wrapper.classList.remove('editor-active');
    wrapper.removeEventListener('click', onMapClick);
    if (tempPin) { tempPin.remove(); tempPin = null; }
  }
}

function onMapClick(e) {
  const wrapper = document.getElementById('mapWrapper');
  const rect = wrapper.getBoundingClientRect();
  const x = ((e.clientX - rect.left)  / rect.width  * 100).toFixed(1);
  const y = ((e.clientY - rect.top)   / rect.height * 100).toFixed(1);
  lastCoords = { x, y };

  // Временный красный маркер
  if (tempPin) tempPin.remove();
  tempPin = document.createElement('div');
  tempPin.style.cssText = `
    position:absolute; left:${x}%; top:${y}%;
    transform:translate(-50%,-50%);
    width:16px; height:16px;
    background:#ff3333; border:3px solid #fff;
    border-radius:50%; pointer-events:none; z-index:50;
    box-shadow:0 2px 8px rgba(0,0,0,0.6);
  `;
  wrapper.appendChild(tempPin);

  // Вывод координат
  const out = document.getElementById('coordOutput');
  out.style.display = 'block';
  out.innerHTML = `pos: { left: ${x}, top: ${y} }`;
}

function copyCoords() {
  if (!lastCoords) return;
  const text = `pos: { left: ${lastCoords.x}, top: ${lastCoords.y} }`;
  navigator.clipboard.writeText(text).then(() => {
    const out = document.getElementById('coordOutput');
    out.innerHTML = `✅ Скопировано! &nbsp; pos: { left: ${lastCoords.x}, top: ${lastCoords.y} }`;
    setTimeout(() => { out.innerHTML = `pos: { left: ${lastCoords.x}, top: ${lastCoords.y} }`; }, 2000);
  });
}
</script>
</body>
</html>
